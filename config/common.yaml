# TBOX 公共配置
common:
  store:
    root: "/var/tbox"
  ipc:
    max_frame_bytes: 10485760    # 10 MiB
    receive_timeout_ms: 60000    # 60 秒空闲超时
    connect_timeout_ms: 3000
    listen_backlog: 5
    reconnect:
      initial_backoff_ms: 100
      max_backoff_ms: 5000
      multiplier: 2.0
  log:
    level: "info"                       # 默认日志级别（trace/debug/info/warn/error）
    strict: false                       # strict=true 时初始化失败 fail-closed；false 降级
    format: "standard"
    console:
      enabled: true
    file:
      enabled: false                    # 生产部署改 true 并指向 /var/log/tbox
      root: "/var/log/tbox"
      max_file_size_mb: 20
      max_files: 5
      total_budget_mb: 100
    async:
      enabled: true
      queue_size: 4096
      flush_interval_ms: 1000
    redact:
      identifiers: "mask"
      raw_payload_max_bytes: 256

cloud:
  endpoint: "https://api.example.com"
  timeout_ms: 5000
  retry_count: 3
  retry_delay_ms: 1000

environment:
  is_production: false
