# =============================================================================
# TBOX SEC Service Configuration - production default template
# TBOX-SEC-DSN-CR-013 §4/§5 / SEC-CONFIG-REQ-002
# =============================================================================
# 由 sec-runtime component 安装到 BUILD rootfs staging 的：
#   逻辑路径：/etc/tbox/conf.d/sec.yaml
#   物理路径：out/<platform>/<profile>/install-root/etc/tbox/conf.d/sec.yaml
#
# framework-config 三层加载（优先级从低到高）：
#   /etc/tbox/common.yaml  ->  /etc/tbox/conf.d/sec.yaml  ->  ./sec.yaml
#   正式 /etc/tbox/common.yaml 由 BUILD 唯一提供（SEC 只消费，不安装/不内联副本）。
#   ./sec.yaml 仅用于测试 profile 覆盖，不进入生产包。
#
# 本模板表示 SEC 服务版本的通用量产发布基线：
#   - 默认并强制 key_provisioning.mode=HSM；
#   - 不含顶层 common: 副本、soft_key 实例值、软件私钥、测试证书、HSM 模拟器状态、
#     PIN、Token、HSM handle、private_key_ref 或 TLS secret；
#   - 不绑定 Orin 车型、车辆或设备实例值；
#   - 可在 BUILD 无平台覆盖时直接作为 Orin 发布配置（§1）。
#
# HSM/SE 量产 PIN/Token/密钥/设备本地安全材料不得由 install 创建或覆盖
# （TBOX-SEC-DSN-CR-012 §9/§12），由 provisioning 提供。
# =============================================================================

# SEC 服务专属配置
sec:
  ipc:
    socket_path: "/tmp/tbox-sec.sock"
  # 生产模板不含 sec.tls.dev_peer_service（仅非生产环境允许固定放行 TLS ACL）

# HSM/SE 生产边界：key_provisioning.mode 必须为 hsm。
# soft_file 密钥模式在量产环境被代码 fail-closed 拒绝（SEC_SOFT_KEY_MODE_NOT_ALLOWED）。
# hsm.type/library_path 为非秘密引用；PIN/Token/slot 由 provisioning 提供，不入此文件。
#
# Orin 部署注入（TBOX-SEC / 无 HSM 车机）：Orin 小车无真实 HSM/SE，SEC 安全
# 部分使用 software（SoftwareHsm）后端。key_provisioning.mode 仍为 hsm，
# 仅将 hsm.type 设为 software（mock）。当接入真实 HSM 的设备时，
# BUILD Orin overlay 覆盖为 type: "pkcs11" 并注入 library_path，
# 同时置 environment.is_production: true。
hsm:
  type: "software"
  library_path: ""

key_provisioning:
  mode: "hsm"

# 云证书注入端点：由部署注入（非秘密 URL）；留空时 submit_csr 不可用但启动不失败
cloud:
  endpoint: ""
  timeout_ms: 5000
  retry_count: 3
  retry_delay_ms: 1000

# 非秘密状态/证书存储路径：留空使用代码默认（/var/lib/tbox/sec/...）
storage:
  state_file: ""
  ca_cert: ""
  cert_store: ""

# Orin 车机使用 software（mock）HSM，非真实安全设备，故 is_production=false；
# 接入真实 HSM 时由 BUILD Orin overlay 覆盖为 true（并将 hsm.type 恢复为 pkcs11）。
environment:
  is_production: false
