# 公共配置覆盖示例（按需启用）
common:
  store:
    root: "./data"
  log:
    level: "debug"                       # 默认日志级别（trace/debug/info/warn/error）
    file: "./log/sec.log"

hsm:
  type: "soft_file"
  library_path: ""

key_provisioning:
  mode: "soft_file"

cloud:
  endpoint: "https://oapi.example.com"
  timeout_ms: 5000
  retry_count: 3
  retry_delay_ms: 1000

storage:
  state_file: "./provision_state.json"
  ca_cert: ""
  cert_store: "./certs"

soft_key:
  path: "./"
  encryption_algo: "aes-256-gcm"
  # KEK(主加密密钥)文件的完整路径；留空则默认 {common.store.root}/.soft_kek
  encryption_key_path: ""

environment:
  is_production: false

sec:
  ipc:
    socket_path: "/tmp/tbox-sec.sock"
  # MQTT TLS Credential Provider (TBOX-SEC-DSN-CR-010)
  # 提供该 profile 后 SEC 才会创建 TlsCredentialProvider；
  # 缺失时 getTlsCredential 直接返回 NOT_IMPLEMENTED (SEC-8004)
  tls:
    # 开发/测试专用：非生产环境下用固定服务名放行 TLS ACL，
    # 绕过 macOS 无 SO_PEERCRED 的限制。生产环境请删除或置空此项！
    dev_peer_service: "tbox-mqtt.service"
    profiles:
      mqtt:
        credential_id: mqtt-primary
        key_usage: clientAuth
        allowed_signature_algorithms:
          - ecdsa_secp256r1_sha256
        peer_service: tbox-mqtt.service
        notify_on_change: true
        # TLS 材料来源：SEC 受控存储 framework-store（服务名 sec）固定 key
        #   root_ca            -> 共享信任根（多处引用：注入校验 + MQTT 服务端验证）
        #   device_cert_chain  -> 设备客户端证书链（PEM，leaf->intermediate）
        # 物理落点：{common.store.root}/sec/root_ca.dat、{common.store.root}/sec/device_cert_chain.dat
        # 量产由注入流程写入；测试环境将证书 PEM 放入上述 .dat 文件即可，无需在此配置路径。
        ref_ttl_sec: 3600
