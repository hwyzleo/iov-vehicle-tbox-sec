common:
  store:
    root: "./data"

ipc:
  max_frame_bytes: 10485760
  receive_timeout_ms: 60000
  connect_timeout_ms: 3000
  listen_backlog: 5
  reconnect:
    initial_backoff_ms: 100
    max_backoff_ms: 5000
    multiplier: 2.0

hsm:
  type: "soft_file"
  library_path: ""

key_provisioning:
  mode: "soft_file"

cloud:
  endpoint: "https://oapi.example.com"
  timeout_ms: 5000
  retry_count: 3
  retry_delay_ms: 1000

storage:
  state_file: "./provision_state.json"
  ca_cert: ""
  cert_store: "./certs"

soft_key:
  path: "./"
  encryption_algo: "aes-256-gcm"
  encryption_key_path: "./"

environment:
  is_production: false

sec:
  ipc:
    socket_path: "/tmp/tbox-sec.sock"
  # MQTT TLS Credential Provider (TBOX-SEC-DSN-CR-010)
  # 提供该 profile 后 SEC 才会创建 TlsCredentialProvider；
  # 缺失时 getTlsCredential 直接返回 NOT_IMPLEMENTED (SEC-8004)
  tls:
    # 开发/测试专用：非生产环境下用固定服务名放行 TLS ACL，
    # 绕过 macOS 无 SO_PEERCRED 的限制。生产环境请删除或置空此项！
    dev_peer_service: "tbox-mqtt.service"
    profiles:
      mqtt:
        credential_id: mqtt-primary
        key_usage: clientAuth
        allowed_signature_algorithms:
          - ecdsa_secp256r1_sha256
        peer_service: tbox-mqtt.service
        notify_on_change: true
        # SEC 受控存储路径；量产由注入流程写入，测试环境指向测试证书
        root_ca_path: "./data/root_ca.crt"
        client_cert_chain_path: "./data/tbox_chain.crt"
        ref_ttl_sec: 3600

log:
  level: "INFO"
  file: "./sec_service.log"
  max_size_mb: 10
  max_files: 5
