common:
  store:
    root: "."

ipc:
  max_frame_bytes: 10485760
  receive_timeout_ms: 60000
  connect_timeout_ms: 3000
  listen_backlog: 5
  reconnect:
    initial_backoff_ms: 100
    max_backoff_ms: 5000
    multiplier: 2.0

hsm:
  type: "soft_file"
  library_path: ""

key_provisioning:
  mode: "soft_file"

cloud:
  endpoint: "https://oapi.example.com"
  timeout_ms: 5000
  retry_count: 3
  retry_delay_ms: 1000

storage:
  state_file: "./provision_state.json"
  ca_cert: ""
  cert_store: "./certs"

soft_key:
  path: "./"
  encryption_algo: "aes-256-gcm"
  encryption_key_path: "./"

environment:
  is_production: false

sec:
  ipc:
    socket_path: "/tmp/tbox-sec.sock"

log:
  level: "INFO"
  file: "./sec_service.log"
  max_size_mb: 10
  max_files: 5
