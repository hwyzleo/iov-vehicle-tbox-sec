syntax = "proto3";

package security.keyprov.v1;

option java_multiple_files = true;
option java_package = "net.hwyz.iov.security.keyprov.v1";

// ---- CR-009 V2C wire canonical registry（VEH-PROTO §7.2.2 同步冻结）----
// WIRE_PROFILE = PAR_PROTO_KEYPROV_ECDH_ES_P256_V1
// wireDigestInput = segment(envelopeFormat)
//                 || segment(UTF8(requestId))
//                 || segment(UTF8(businessDomain))
//                 || segment(unsignedVarint(purpose))
//                 || segment(UTF8(keyId))
//                 || segment(uint64be(businessKeyVersion))
//                 || segment(unsignedVarint(wrappingSuite))
//                 || segment(wrappedKey)
//                 || segment(originalDeterministicParametersBytes)
// wireEnvelopeDigest = SHA-256(wireDigestInput)
// segment(x) = uint32be(len(x)) || x；共且仅有 9 个顶层 segment。
// 禁止 enum name()/ordinal()、十进制 version、JSON、Base64/hex 文本或 parse 后
// 重编码 parameters；wrappedKey/parameters 使用收到的原始 bytes（canonical 校验
// 通过后不得替换）。envelope_digest 字段本身不进入摘要。
// WrappedKeyItem.envelope_digest 只承载 wireEnvelopeDigest；FW-SEC 18 字段
// coreEnvelopeDigest 为内部事实，不得进入 wire/ACK/proof。
//
// AAD_PROFILE = PAR_PROTO_KEYPROV_AAD_V1（10 段，顺序固定；nonce 不进入 AAD）:
//   canonicalAad = segment(envelopeFormat)              // unsigned varint
//               || segment(wrappingSuite)               // unsigned varint，登记值 2
//               || segment(purpose)                     // unsigned varint
//               || segment(uint64be(businessKeyVersion))
//               || segment(uint64be(rootKeyVersion))
//               || segment(recipientCertificateDigest)  // 原始 32 bytes，非 hex/文本
//               || segment(UTF8(requestId))
//               || segment(UTF8(businessDomain))
//               || segment(UTF8(keyId))
//               || segment(UTF8(derivationVersion))
// aadDigest = SHA-256(canonicalAad)。云端 AES-GCM 加密实际使用的 AAD 必须与
// canonical_aad 逐字节相同；TBOX-SEC 从 outer context 重建 AAD 并与承载值和
// aad_digest 常量时间比较，随后使用同一 AAD 执行 GCM 解封。
//
// businessKeyVersion 有效范围 1..2^63-1，编码固定 8 字节 unsigned big-endian。
// =============================================================================

// 信封格式（PAR-PROTO-DSN-CR-007 §3 / CR-009）。
enum KeyEnvelopeFormat {
  KEY_ENVELOPE_FORMAT_UNSPECIFIED = 0;
  KEY_ENVELOPE_FORMAT_ECDH_ES_P256_V1 = 1;
}

// 封装套件（PAR-PROTO-DSN-CR-009 §2：ECDH_ES_P256_HKDF_SHA256_AES256GCM 登记值 = 2）。
enum WrappingSuite {
  WRAPPING_SUITE_UNSPECIFIED = 0;
  WRAPPING_SUITE_ECDH_ES_P256_HKDF_SHA256_AES256GCM = 2;
}

// 业务密钥用途（PAR-PROTO-DSN-CR-009 §2：UPLINK=1、DOWNLINK=2，0 保留且生产拒绝）。
enum KeyPurpose {
  KEY_PURPOSE_UNSPECIFIED = 0;
  KEY_PURPOSE_UPLINK_AEAD = 1;
  KEY_PURPOSE_DOWNLINK_AEAD = 2;
}

// ECDH-ES P-256 v1 信封参数（PAR-PROTO-DSN-CR-007 §3/§7；字段号/类型已冻结）。
//
// `parameters` wire type 保持 bytes，内容为本消息的 deterministic serialization。
// 消费者解析后必须先拒绝 unknown fields，再通过
// google::protobuf::io::CodedOutputStream::SetSerializationDeterministic(true)
// 与 SerializeToCodedStream 显式 deterministic reserialize，并与收到的原始
// bytes 逐字节比较（普通 SerializeToString 不得作为确定性契约校验）。
// wire digest / 幂等摘要始终使用收到且已通过 canonical 校验的原始 parameters bytes。
message EcdhEsP256EnvelopeParametersV1 {
  uint32 format_version = 1;                 // MUST equal 1
  bytes server_ephemeral_public_key = 2;     // P-256 SEC1 uncompressed, 65 bytes
  bytes hkdf_salt = 3;                       // 32 bytes
  string hkdf_context_version = 4;           // "v1"
  bytes nonce = 5;                           // AES-GCM nonce, 12 bytes
  bytes authentication_tag = 6;              // 16 bytes
  bytes canonical_aad = 7;                   // PAR_PROTO_KEYPROV_AAD_V1 canonical bytes（10 段 registry）
  bytes aad_digest = 8;                      // SHA-256(canonical_aad), 32 bytes
  uint64 root_key_version = 9;
  string derivation_version = 10;
  bytes recipient_certificate_digest = 11;   // SHA-256 policy digest, 32 bytes
  string operation_id = 12;
}
